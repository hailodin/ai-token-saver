# aiproxy — token-stripping intercept proxy for Cursor

listen_host: "127.0.0.1"
listen_port: 8080
# Live savings dashboard (requested / forwarded / saved tok+chars)
dashboard_port: 8081
# Friendly local URL: http://tokensaver.local/  (no port)
# One-time: sudo "$(pwd)/.venv/bin/python" -m aiproxy --install-hostname
#   Windows (Administrator PowerShell, in this folder):
#   & "$(Get-Location)\.venv\Scripts\python.exe" -m aiproxy --install-hostname
#   → hosts: 127.0.0.2 tokensaver.local
#   → privileged alias service reads dashboard_port from this file
#     (change the port anytime — no need to reinstall the hostname)
dashboard_hostname: "tokensaver.local"
dashboard_alias_ip: "127.0.0.2"
dashboard_alias_port: 80
# Persisted across launches (totals, recent requests, chart buckets)
stats_path: "logs/stats.json"

pricing:
  # Dollar estimates use the *most expensive* of this model and any priceable
  # models seen in traffic (upper bound).
  #
  # Detection: Agent WS bodies almost always send model "default" (Auto /
  # Cursor Router). The concrete model is chosen server-side and is often
  # hidden. We try: (1) server response sniff, (2) Cursor local UI state,
  # (3) this assume_model fallback for remaining Auto/unknown traffic.
  #   claude-opus-5 / claude-opus-4-8  -> ~$15 per 1M input tokens
  #   claude-sonnet-5-5                -> ~$3
  #   gpt-5                            -> ~$1.25
  #   grok-4.7                         -> ~$3
  assume_model: "claude-opus-5"

# mitm      = HTTPS forward proxy for Cursor default models (streaming fixed)
# reverse   = JSON reverse proxy for Cursor BYOK + Claude Code
# openai    = reverse proxy for Cursor OpenAI Base URL (BYOK) only
# anthropic = reverse proxy for Claude Code ANTHROPIC_BASE_URL only
mode: mitm

# Upstreams for reverse-proxy modes
openai_upstream: "https://api.openai.com"
anthropic_upstream: "https://api.anthropic.com"

# Hosts whose request bodies we try to rewrite
intercept_hosts:
  - "api2.cursor.sh"
  - "api3.cursor.sh"
  - "api4.cursor.sh"
  - "*.cursor.sh"
  - "*.cursorapi.com"
  - "api.openai.com"
  - "api.anthropic.com"

# Exact hosts to short-circuit with 204 (leave empty unless you know a safe target)
block_hosts: []
# Suffix match for obvious analytics — does not affect Cursor API hosts
block_host_suffixes:
  - "amplitude.com"
  - "sentry.io"
  - "segment.io"
  - "segment.com"
  - "mixpanel.com"

strip:
  # Keep only the last N messages (messages[] or input[]). System/developer kept separately.
  # Tighter = less cache/input on long agent chats. Raise if the model "forgets" earlier turns.
  max_messages: 16

  # Hard cap on any single message/content part (chars). Older turns get stricter caps.
  # For Cursor Connect/protobuf: prefer dedupe over gutting — very low caps caused
  # upstream 400 "content missing". These are mid-aggressive (was 200k / 200k).
  max_chars_recent: 48000
  max_chars_old: 12000

  # How many trailing turns count as "recent"
  recent_turn_window: 4

  # Drop assistant thinking / reasoning blocks when present as separate parts
  drop_reasoning_parts: true

  # Collapse duplicate fenced code / path-labeled file dumps to one copy
  dedupe_file_blocks: true

  # Truncate old tool/function results aggressively (biggest easy win on agent loops)
  max_tool_result_chars: 1000

  # Stub embedded file/code blobs inside agent WebSocket / RunSSE prompts.
  # (BidiAppend file-sync is never rewritten — that breaks replies.)
  max_bidi_file_chars: 800

  # Remove noisy top-level keys Cursor / clients sometimes attach
  drop_keys:
    - "include_obfuscation"
    - "prompt_cache_retention"
    - "store"
    - "metadata"
    - "safety_identifier"
    - "service_tier"

  # Optional: strip long repeated "Rules" / "Always applied" blobs from system text
  compress_system: true
  max_system_chars: 8000

  # Dry-run: log savings but forward the original body.
  # Live rewrite is on; a safety gate skips applies that would drop >50% of chars.
  dry_run: false

# Claude Code (requests to Anthropic's /v1/messages) never goes through the
# strip rules above: dropping old messages, shortening the system prompt or
# removing thinking blocks breaks its prompt cache, so every request would be
# billed as new, and current models can refuse an edited history. See
# CLAUDE-CODE-NOTES.md. What it gets instead is lossless: a tool result in the
# newest message that is byte-identical to an earlier one becomes a short
# pointer to that copy. The dashboard's "Claude Code" row shows real spend
# from Anthropic's own usage numbers. Dry-run applies here too.
claude:
  enabled: true              # false = forward Claude Code untouched (still measured)
  dedupe_tool_results: true
  dedupe_min_chars: 300      # a pointer is ~150 chars; smaller results are left alone
  state_path: "logs/claude_state.json"   # every pointer ever sent, replayed identically
  stats_path: "logs/claude_stats.json"

logging:
  level: INFO
  # Write before/after JSON samples (redacted) for tuning rules
  dump_dir: "logs"
  dump_bodies: true
  # Only dump when we actually changed something
  dump_only_when_stripped: true